# Dataset
dataset: cifar10
data_dir: ./data
image_size: 32
in_channels: 3
batch_size: 64
num_workers: 0

# Diffusion
schedule: cosine
T: 1000
beta_start: 0.0001
beta_end: 0.02
predict_type: eps

# Model (medium/small for CPU compatibility)
base_channels: 32
channel_mults: [1, 2, 4]
num_res_blocks: 1
attention_resolutions: [8]
num_heads: 2
dropout: 0.1

# Training
lr: 0.0002
epochs: 2
grad_clip: 1.0
ema_decay: 0.9999
sample_every: 1
sample_batch_size: 16
log_dir: ./runs/cifar10_ddpm
checkpoint_dir: ./checkpoints/cifar10_ddpm

# Sampling
ddim_steps: 50
ddim_eta: 0.0
