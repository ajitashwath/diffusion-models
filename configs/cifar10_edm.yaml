# Dataset
dataset: cifar10
data_dir: ./data
image_size: 32
in_channels: 3
batch_size: 64
num_workers: 0

# EDM Scheduler (Karras 2022)
sigma_min: 0.002
sigma_max: 80.0
sigma_data: 0.5
rho: 7.0
P_mean: -1.2
P_std: 1.2
S_churn: 0.0
S_tmin: 0.05
S_tmax: 50.0
S_noise: 1.003

# Model (same as DDPM)
base_channels: 32
channel_mults: [1, 2, 4]
num_res_blocks: 1
attention_resolutions: [8]
num_heads: 2
dropout: 0.1

# Training
lr: 0.0002
epochs: 2
grad_clip: 1.0
ema_decay: 0.9999
sample_every: 1
sample_batch_size: 16
log_dir: ./runs/cifar10_edm
checkpoint_dir: ./checkpoints/cifar10_edm

# EDM Sampling
edm_steps: 18
